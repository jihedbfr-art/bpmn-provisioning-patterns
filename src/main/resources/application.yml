spring:
  application:
    name: bpmn-provisioning-patterns
  datasource:
    url: jdbc:h2:mem:provisioning;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    listener:
      ack-mode: RECORD
      concurrency: 1
  flyway:
    table: flyway_provisioning_history
    baseline-on-migrate: true

camunda:
  bpm:
    database:
      schema-update: true
    admin-user:
      id: ${CAMUNDA_ADMIN_USER:demo}
      password: ${CAMUNDA_ADMIN_PASSWORD:demo}
    history-level: full

provisioning:
  kafka:
    topic: number-portability-events
    donor-response-topic: donor-response-events
  outbox:
    relay:
      enabled: true
      interval: PT1S
      batch-size: 50
      send-timeout: PT5S
  sla:
    donor-response-timeout: PT30M
  reconciliation:
    stuck-threshold: PT15M
  bulk-sim:
    default-rollback-threshold: 0.2
