spring:
  application:
    name: bpmn-provisioning-patterns
  datasource:
    url: jdbc:h2:mem:provisioning;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  kafka:
    bootstrap-servers: localhost:9092

camunda:
  bpm:
    database:
      schema-update: true
    admin-user:
      id: demo
      password: demo
    history-level: full

provisioning:
  kafka:
    topic: number-portability-events
  sla:
    donor-response-timeout: PT30M
